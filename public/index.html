<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocVault — Gestão de Documentos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- LOGIN -->
  <div id="page-login" class="page active">
    <div class="login-wrap">
      <div class="login-brand">
        <span class="brand-icon">⬡</span>
        <h1>DocVault</h1>
        <p>Sistema de gestão e aprovação de documentos</p>
      </div>
      <form id="form-login" class="login-form" novalidate>
        <div class="field">
          <label for="login-email">E-mail</label>
          <input id="login-email" type="email" placeholder="seu@email.dev" autocomplete="username" required />
        </div>
        <div class="field">
          <label for="login-password">Senha</label>
          <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required />
        </div>
        <div id="login-error" class="alert alert-error hidden"></div>
        <button type="submit" class="btn btn-primary btn-full">Entrar</button>
      </form>
      <p class="login-hint">
        Teste: <code>admin@docvault.dev</code> / <code>Admin@2026!</code>
      </p>
    </div>
  </div>

  <!-- APP -->
  <div id="page-app" class="page">
    <header class="topbar">
      <div class="topbar-brand">
        <span class="brand-icon-sm">⬡</span>
        <span class="brand-name">DocVault</span>
      </div>
      <nav class="topbar-nav" id="top-nav"></nav>
      <div class="topbar-user">
        <span id="user-badge"></span>
        <button class="btn btn-ghost btn-sm" id="btn-logout">Sair</button>
      </div>
    </header>

    <main class="main-content">

      <!-- PAINEL: DOCUMENTOS -->
      <section id="panel-documents" class="panel active">
        <div class="panel-header">
          <h2>Documentos</h2>
          <button class="btn btn-primary btn-sm" id="btn-new-doc">+ Novo documento</button>
        </div>
        <div class="filter-bar">
          <select id="filter-status">
            <option value="">Todos os status</option>
            <option value="pendente">Pendente</option>
            <option value="em_analise">Em análise</option>
            <option value="aprovado">Aprovado</option>
            <option value="rejeitado">Rejeitado</option>
          </select>
        </div>
        <div id="doc-list" class="doc-list"></div>
      </section>

      <!-- PAINEL: USUÁRIOS (admin) -->
      <section id="panel-users" class="panel">
        <div class="panel-header">
          <h2>Usuários</h2>
          <button class="btn btn-primary btn-sm" id="btn-new-user">+ Novo usuário</button>
        </div>
        <div id="user-list" class="user-list"></div>
      </section>

      <!-- PAINEL: LOGS (admin) -->
      <section id="panel-logs" class="panel">
        <div class="panel-header">
          <h2>Logs de Auditoria</h2>
          <button class="btn btn-ghost btn-sm" id="btn-refresh-logs">↻ Atualizar</button>
        </div>
        <div class="filter-bar">
          <input id="filter-log-email" type="text" placeholder="Filtrar por e-mail..." />
          <select id="filter-log-action">
            <option value="">Todas as ações</option>
            <option value="LOGIN_SUCCESS">LOGIN_SUCCESS</option>
            <option value="LOGIN_FAILED">LOGIN_FAILED</option>
            <option value="ACCESS_DENIED">ACCESS_DENIED</option>
            <option value="DOC_CREATED">DOC_CREATED</option>
            <option value="DOC_STATUS_CHANGED">DOC_STATUS_CHANGED</option>
            <option value="DOC_EDITED">DOC_EDITED</option>
            <option value="DOC_DELETED">DOC_DELETED</option>
            <option value="USER_CREATED">USER_CREATED</option>
          </select>
          <button class="btn btn-ghost btn-sm" id="btn-filter-logs">Filtrar</button>
        </div>
        <div id="log-table-wrap" class="table-wrap"></div>
      </section>

    </main>
  </div>

  <!-- MODAL genérico -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Modal</h3>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
