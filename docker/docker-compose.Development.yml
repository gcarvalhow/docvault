name: docvault-dev

services:
  postgres:
      image: postgres:latest
      container_name: docvault-dev
      restart: on-failure
      environment:
        POSTGRES_USER: docvault
        POSTGRES_PASSWORD: docvault
        POSTGRES_DB: docvault
      ports:
        - "5432:5432"
      volumes:
        - pg_data:/var/lib/postgresql
      deploy:
        resources:
          limits:
            memory: 512M

volumes:
  pg_data:
    driver: local

networks:
  default:
    name: docvault-dev